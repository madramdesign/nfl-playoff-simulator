# Render Blueprint: runs server.js as a public web service (docs/DECISIONS.md DEC-018).
# Public sources only: FABRIC_SCOPES=public keeps ESPN's JSON endpoints off, as DEC-006 requires for anything published.
services:
  - type: web
    name: nfl-universe
    runtime: node
    plan: free
    branch: main
    autoDeploy: true            # the daily refresh commit to main redeploys the page
    # The server reads none of these at run time (only data/news.json and public/): the data fetch, FantasyPros and
    # fetch-request commits, several a day, no longer restart it, so visitors meet a cold start less often (DEC-025).
    buildFilter:
      ignoredPaths:
        - data/fabric/**
        - data/fantasypros/**
        - data/snapshots/**
    buildCommand: node --version   # no dependencies to install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: FABRIC_SCOPES
        value: public
      - key: TRUST_PROXY
        value: "1"
      # Licensed live scores (DEC-027): The Odds API's /scores, on once ODDS_API_KEY is set (20K plan or more for
      # game-day polling). Render ignores sync: false on an existing Blueprint (render.com/docs/blueprint-spec, checked
      # Nov. 26, 2026), so the owner adds the key by hand in the service's Environment settings; it never goes in this file.
      - key: ODDS_API_KEY
        sync: false
      - key: LIVE_SCORES
        value: odds-api
      # The pre-game odds source stays off here: Render's restarts would forget its 11 hours between paid looks.
      - key: FABRIC_OFF
        value: odds-api
