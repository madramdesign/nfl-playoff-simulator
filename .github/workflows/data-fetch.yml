name: Daily data fetch

# The data-fabric snapshot (DEC-021). The scheduled refresh on claude.ai runs in a workspace that reaches only GitHub
# and package registries, so most public sources (weather, headlines, videos, podcasts, The Odds API) failed there.
# This job fetches them on GitHub's servers and commits the snapshot; the refresh's `npm run refresh` keeps a snapshot
# under 8 hours old instead of fetching again. GitHub starts scheduled jobs hours late or skips them (none ran from
# Nov. 24, 18:48 to Nov. 25, 17:20 UTC), so the refresh also asks for a fetch itself: `scripts/request-fetch.js` pushes
# data/fabric/fetch-request.json to main, and a push starts this job at once (DEC-023). The schedule stays as a backup.
# Public sources only (DEC-006).
on:
  push:
    branches: [main]
    paths: [data/fabric/fetch-request.json]   # a request from the daily refresh (DEC-023)
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (off the hour, when GitHub's scheduler is busiest)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh       # shared with the backup refresh, so the two never push at once
  cancel-in-progress: false

# ESPN's NFL RSS feed answers GitHub's servers with an empty HTTP 202 (its content network holds them back), so it is
# switched off here and says why; the hosted and local servers still read it (DEC-024).
env:
  FABRIC_OFF: rss-espn

jobs:
  fetch:
    # only from main: a manual run on another branch must never push that branch's code to main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The fabric's cache between runs: The Odds API is then looked at no more than every 11 hours. A public run keeps
      # no sportsbook's own prices, so the cache holds only what is published anyway.
      - name: Restore the fabric's cache
        uses: actions/cache@v4
        with:
          path: .cache/fabric/public
          key: fabric-public-${{ github.run_id }}
          restore-keys: fabric-public-
      - name: Fetch every public source and write the snapshot
        run: node scripts/fabric-snapshot.js
        env:
          # optional: The Odds API stays off when this secret is not set (DEC-019); only its median line is published
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fabric
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Data fetch (GitHub Actions)"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "::warning::The data fetch could not be pushed to main; the refresh will fetch on its own."
          exit 1
