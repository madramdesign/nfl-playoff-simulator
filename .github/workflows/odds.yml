name: Fetch sportsbook lines

# Runs on GitHub's servers. The key lives in the repository secret ODDS_API_KEY (Settings > Secrets and variables >
# Actions) and is never written to a file. One run costs 3 of the free tier's 500 credits a month; twice a day uses about 180.
on:
  schedule:
    - cron: "20 8 * * *"    # about 3:20 AM Eastern, before the page refresh
    - cron: "20 21 * * *"   # about 4:20 PM Eastern
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/fetch_odds.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds
          git diff --cached --quiet || git commit -m "Sportsbook lines refresh"
          git pull --rebase origin main
          git push origin HEAD:main
